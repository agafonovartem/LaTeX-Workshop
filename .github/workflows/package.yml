name: Build iPad fork VSIX
on:
  push:
    branches: [master]
    tags: ['ipad-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run package:fork
      - uses: actions/upload-artifact@v7
        with:
          name: latex-workshop-ipad-${{ github.sha }}
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 90
